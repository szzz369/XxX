<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>购物应用原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 id="page-title">首页</h1>
    </header>

    <main id="main-content" class="main-content"></main>

    <nav class="tabbar">
      <button class="tabbar-item" data-route="home">
        <span>首页</span>
      </button>
      <button class="tabbar-item" data-route="cart">
        <span>购物车</span>
      </button>
      <button class="tabbar-item" data-route="orders">
        <span>订单</span>
      </button>
      <button class="tabbar-item" data-route="points">
        <span>积分中心</span>
      </button>
      <button class="tabbar-item" data-route="admin">
        <span>管理端</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
